# Generated by agent-init. Fails if committed agent config differs from what .rulesync/ generates.
# Rulesync version is pinned; to upgrade, bump ~/.config/agent-setup/RULESYNC_VERSION and re-run agent-init.
name: agent-config-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Regenerate agent config (rulesync 24.0.0)
        run: npx --yes rulesync@24.0.0 generate --silent
      - name: Fail if generated files are out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Agent config is out of date. Run 'rulesync generate' locally and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
